name: "Project 10: Capstone, a full CI/CD pipeline"

on:
    push:
    workflow_dispatch:
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && format('tag-{0}', github.run_id) || github.ref }}
    cancel-in-progress: true

jobs:
    ci-pipeline:
        strategy:
            matrix:
                python-version: [3.11, 3.12]
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                python-version: ${{ matrix.python-version }}

            - name: Run Test
              run: python -m unittest -v

    lint-the-dockerfile:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Checks that base images are pinned
              id: docker-lint
              continue-on-error: true
              uses: DhruvP2205/P9-Docker-Action@main
              with:
                dockerfile: ./Dockerfile
                fail_on_unpinned: "true"

            - name: Checkout Docker Pinned Report
              env:
                actual_count: ${{ steps.docker-lint.outputs.unpinned_count }}
                actual_report: ${{ steps.docker-lint.outputs.report }}
                ACTUAL_OUTCOME: ${{ steps.docker-lint.outcome }}
              run: |
                echo "Docker Lint Job: $ACTUAL_OUTCOME"
                echo "Unpinned Dockerfile Found: $actual_count"
                echo "----> REPORT <----"
                echo "$actual_report"

                if [ "$ACTUAL_OUTCOME" -eq "failure" ]; then
                    echo "Job Failed"
                    exit 1
                fi
