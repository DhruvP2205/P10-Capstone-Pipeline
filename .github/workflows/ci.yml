name: "Project 10: Capstone, a full CI/CD pipeline"

on:
    push:
      branches: ["**"]
      tags:
        - "v*.*.*"
    workflow_dispatch:
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && format('tag-{0}', github.run_id) || github.ref }}
    cancel-in-progress: true

jobs:
    ci-pipeline:
        strategy:
            matrix:
                python-version: ["3.11", "3.12"]
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                python-version: ${{ matrix.python-version }}

            - name: Run Test
              run: python -m unittest -v

    lint-the-dockerfile:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Checks that Docker images are pinned
              id: docker-lint
              continue-on-error: true
              uses: DhruvP2205/P9-Docker-Action@main
              with:
                dockerfile: ./Dockerfile
                fail_on_unpinned: "true"

            - name: Checkout Docker Pinned Report
              env:
                actual_count: ${{ steps.docker-lint.outputs.unpinned_count }}
                actual_report: ${{ steps.docker-lint.outputs.report }}
                ACTUAL_OUTCOME: ${{ steps.docker-lint.outcome }}
              run: |
                echo "Docker Lint Job: $ACTUAL_OUTCOME"
                echo "Unpinned Dockerfile Found: $actual_count"
                echo "----> REPORT <----"
                echo "$actual_report"

                if [ "$ACTUAL_OUTCOME" != "success" ]; then
                    echo "Job Failed"
                    exit 1
                fi

    build-and-test:
      needs: ["ci-pipeline","lint-the-dockerfile"]
      runs-on: ubuntu-24.04
      steps:
        - name: Checkout Code
          uses: actions/checkout@v7

        - name: Build Docker Image and Run
          run: docker build -t demo-app:ci .

        - name: Check the Image
          run: docker images

        - name: Run Container
          run: docker run -d --name demo-app -p 8080:8000 demo-app:ci

        - name: Check the Running Container
          run: docker ps

        - name: Smoke Test
          run: |
            echo "Waiting for /health endpoint (Takes 30s)..."
              for i in {1..30}; do
                  if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health | grep -q "200"; then
                      echo "Health check passed!"
                      exit 0
                  fi
                  sleep 1
              done

              echo "Health check failed! Container logs:"
              docker logs demo-app
              exit 1

        - name: Stop Running Container
          if: always()
          run: docker rm -f demo-app || true

    publish-container:
      needs: ["build-and-test"]
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        OWNER: ${{ github.repository_owner }}
      permissions:
        contents: read
        packages: write
      runs-on: ubuntu-24.04
      steps:
        - name: Checkout Code
          uses: actions/checkout@v7

        - name: Semver check
          uses: DhruvP2205/P8-JavaScript-Action@v1
          with:
            version: ${{ github.ref_name }}
            allow-prefix-v: "true"
            fail-on-invalid: "true"

        - name: "Setup Env"
          run: |
            echo "OWNER_LOWER=${OWNER,,}" >> "$GITHUB_ENV"

        - name: Docker Metadata
          id: docker-meta
          uses: docker/metadata-action@v6
          with:
            images: ghcr.io/${{ env.OWNER_LOWER }}/demo-app
            tags: |
              type=sha,format=short,prefix=sha-
              type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=semver,pattern={{major}}

        - name: Login GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Build and push
          uses: docker/build-push-action@v7
          with:
            push: true
            tags: ${{ steps.docker-meta.outputs.tags }}
            labels: ${{ steps.docker-meta.outputs.labels }}