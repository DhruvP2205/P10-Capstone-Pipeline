name: "Project 10: Capstone, a full CI/CD pipeline"

on:
    push:
    workflow_dispatch:
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && format('tag-{0}', github.run_id) || github.ref }}
    cancel-in-progress: true

jobs:
    ci-pipeline:
        strategy:
            matrix:
                python-version: [3.11, 3.12]
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                python-version: ${{ matrix.python-version }}

            - name: Run Test
              run: python -m unittest -v